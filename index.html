  if(/history|martyrs|life of|christian church|philosophy of revelation|person of christ/.test(t))return"history";
  if(/morning and evening|checkbook|daily readings|everlasting rest|prayer|meditation|letters|contentment|holiness|crook|cordial|lovely|armour|saint indeed/.test(t))return"devotional";
  return"doctrine";
}
function eraOf(y){return y<1500?"anc":y<1600?"ref":y<1700?"pur":y<1800?"aw":y<1900?"mod":"c20"}

/* Expand the compact catalog into full book records. */
function expand(d){
  var out=[],vi=d.vi||{};
  d.authors.forEach(function(au){
    var col="hsl("+hue(au.id)+",42%,30%)";
    AUTHORS.push({id:au.id,name:au.name});
    var add=function(slug,title,year){
      var key=au.id+"/"+slug,i=au.id.charAt(0),base="https://ccel.org/ccel/"+au.id+"/"+slug+"/"+slug;
      out.push({id:key,c:"theology",ty:typeOf(title,key,d.types),er:au.era||"mod",y:year||0,col:col,a:au.name,au:au.id,
        en:{t:title,n:T.en.ccelnote},vi:{t:vi[key]||title,n:T.vi.ccelnote},
        read:base,listen:base+"/mp3",
        dl:{PDF:"https://ccel.org/ccel/"+i+"/"+au.id+"/"+slug+"/cache/"+slug+".pdf",
            EPUB:"https://ccel.org/ccel/"+i+"/"+au.id+"/"+slug+"/cache/"+slug+".epub",
            TXT:"https://ccel.org/ccel/"+i+"/"+au.id+"/"+slug+"/cache/"+slug+".txt"}});
    };
    au.books.forEach(function(b){add(b[0],b[1],b[2])});
    if(au.seq){for(var n=au.seq.from;n<=au.seq.to;n++){
      var nn=(n<10?"0":"")+n;
      add(au.seq.slug+nn,au.seq.title+" "+nn+": "+spurgeonYear(n),spurgeonYear(n));
    }}
  });
  AUTHORS.push({id:"vn",name:"Tiếng Việt · Vietnamese"});
  AUTHORS.push({id:"mg",name:"Monergism · free ebooks"});
  var nk=function(t){return t.toLowerCase().replace(/[^a-z0-9]/g,"")},have={};
  out.forEach(function(b){have[nk(b.en.t)]=1});
  if(d.mg)d.mg.b.forEach(function(r){if(have[nk(r[1])])return;var au=d.mg.a[r[0]];out.push({id:"mg/"+r[2],ty:typeOf(r[1],"",null),er:au[1],y:0,col:"hsl("+hue(au[0])+",42%,30%)",a:au[0],au:"mg",mg:1,url:"https://www.monergism.com/"+r[2],en:{t:r[1],n:T.en.mgnote},vi:{t:r[1],n:T.vi.mgnote}})});
  (d.extra||[]).forEach(function(b){b.au=b.url?"vn":"other";b.er=eraOf(b.y);out.push(b)});
  AUTHORS.push({id:"other",name:null});
  return out;
}

function prog(id){return st.prog[id]||{s:"todo",p:0}}
function passes(b){
  var p=prog(b.id),q=st.q.toLowerCase();
  if(st.f==="saved"&&st.saved.indexOf(b.id)<0)return false;
  if(st.f==="reading"&&p.s!=="reading")return false;
  if(st.f==="done"&&p.s!=="done")return false;
  if(st.au!=="all"&&b.au!==st.au)return false;
  if(st.ty!=="all"&&b.ty!==st.ty)return false;
  if(st.er!=="all"&&b.er!==st.er)return false;
  if(q){
    var hay=[b.a,b.en.t,b.en.n,b.vi&&b.vi.t,b.vi&&b.vi.n].join(" ").toLowerCase();
    if(hay.indexOf(q)<0)return false;
  }
  return true;
}
function card(b){
  var lg=st.lang,d=b[lg]||b.en,o=b[lg==="vi"?"en":"vi"]||{};
  var s=st.saved.indexOf(b.id)>=0,p=prog(b.id),links;
  if(b.url){
    links='<a href="'+b.url+'" target="_blank" rel="noopener">'+tx("read")+(b.mg?' · Monergism':' (VN)')+'</a>'+(b.pdf?'<a href="'+b.pdf+'" target="_blank" rel="noopener">PDF</a>':"");
  }else if(b.read){
    links='<a href="reader.html?id='+encodeURIComponent(b.id)+'">'+tx("rhere")+'</a><a href="'+b.read+'" target="_blank" rel="noopener">CCEL</a>';
    for(var f in b.dl)links+='<a href="'+b.dl[f]+'" target="_blank" rel="noopener">'+f+'</a>';
  }else{
    var ks=b.q||b.en.t;
    links='<a href="'+G(ks)+'" target="_blank" rel="noopener">'+tx("read")+'</a><a href="'+L(b.en.t)+'" target="_blank" rel="noopener">'+tx("listen")+'</a><a href="'+A(ks)+'" target="_blank" rel="noopener">'+tx("archive")+'</a>';
  }
  var y=b.y?" · "+(b.y<0?Math.abs(b.y)+" BC":b.y):"";
  var alt=(lg==="vi"&&o.t&&o.t!==d.t)?" · "+esc(o.t):"";
  var sel='<select data-pid="'+esc(b.id)+'" aria-label="'+tx("reading")+'">'+["todo","reading","done"].map(function(v){return'<option value="'+v+'"'+(p.s===v?" selected":"")+'>'+tx(v)+'</option>'}).join("")+'</select>';
  var rng=p.s==="reading"?'<div class="pr"><input type="range" min="0" max="100" step="5" value="'+p.p+'" data-rid="'+esc(b.id)+'" aria-label="%"><output>'+p.p+'%</output></div>':"";
  return'<article class="book"><div class="spine" style="background:'+b.col+'"><b>'+tx("ty_"+b.ty)+y+'</b><i>'+esc(d.t)+'</i></div><div class="body"><h3>'+esc(d.t)+'</h3><p class="by">'+esc(b.a)+alt+'</p><p class="note">'+esc(d.n)+'</p><div class="links">'+links+'</div><div class="prog">'+sel+rng+'</div><button type="button" class="fav" data-id="'+esc(b.id)+'" aria-pressed="'+s+'">'+(s?tx("saved2"):tx("save"))+'</button></div></article>';
}
function renderCont(){
  var r=BOOKS.filter(function(b){return prog(b.id).s==="reading"}).sort(function(a,b){return(prog(b.id).t||0)-(prog(a.id).t||0)}).slice(0,4);
  var el=$("cont");
  if(!r.length){el.hidden=true;return}
  el.hidden=false;
  el.innerHTML='<h2>'+tx("cont")+'</h2><div class="controw">'+r.map(function(b){
    var d=b[st.lang]||b.en,p=prog(b.id),href=b.read?"reader.html?id="+encodeURIComponent(b.id):(b.url||G(b.q||b.en.t));
    return'<div class="ci"><b>'+esc(d.t)+'</b><div class="meter"><i style="width:'+p.p+'%"></i></div><a href="'+href+'">'+tx("cont2")+' · '+p.p+'%</a></div>';
  }).join("")+'</div>';
}
function yr(b){return b.y||ERAMID[b.er]}
function sorted(list){
  var s=st.so,lg=st.lang;
  if(s==="0")return list;
  var n=function(b){return(b[lg]||b.en).t.toLowerCase()};
  var cmp={"1":function(a,b){return n(a)<n(b)?-1:n(a)>n(b)?1:0},
           "2":function(a,b){return a.a<b.a?-1:a.a>b.a?1:(n(a)<n(b)?-1:1)},
           "3":function(a,b){return yr(a)-yr(b)},
           "4":function(a,b){return yr(b)-yr(a)}}[s];
  return list.slice().sort(cmp);
}
function filtersOn(){return st.au!=="all"||st.ty!=="all"||st.er!=="all"||st.so!=="0"||st.q!==""||st.f!=="all"}
function render(){
  var all=sorted(BOOKS.filter(passes)),show=all.slice(0,st.limit);
  $("clear").hidden=!filtersOn();
  $("grid").innerHTML=show.length?show.map(card).join(""):'<div class="empty">'+(st.f==="saved"?tx("nosaved"):(st.f==="reading"||st.f==="done")?tx("noreading"):tx("none"))+'</div>';
  $("count").textContent=all.length+" "+tx("of")+" "+BOOKS.length+" "+tx("titles");
  var m=$("more"),left=all.length-show.length;
  m.hidden=left<=0;m.textContent=tx("more")+" ("+left+")";
  renderCont();
}
function buildAuthors(){
  var cnt={};BOOKS.forEach(function(b){cnt[b.au]=(cnt[b.au]||0)+1});
  var opts=function(id,first,items,cur){var sel=$(id);sel.innerHTML='<option value="all">'+first+'</option>'+items.map(function(i){return'<option value="'+i[0]+'">'+esc(i[1])+'</option>'}).join("");sel.value=cur};
  opts("author",tx("allAuthors"),AUTHORS.map(function(a){return[a.id,(a.name||tx("other"))+(cnt[a.id]?" ("+cnt[a.id]+")":"")]}),st.au);
  opts("type",tx("allTypes"),TYPES.map(function(t){return[t,tx("ty_"+t)]}),st.ty);
  opts("era",tx("allEras"),ERAS.map(function(e){return[e,tx("er_"+e)]}),st.er);
  var so=$("sort"),cur=st.so;so.innerHTML=["0","1","2","3","4"].map(function(k){return'<option value="'+k+'">'+tx("sort"+k)+'</option>'}).join("");so.value=cur;
  $("clear").textContent=tx("clear");
}
function labels(){
  document.documentElement.lang=st.lang;
  var m={lede:"lede",lang:"lang",theme:"theme",exp:"exp",imp:"imp",sync:"sync",about:"about","s-h":"sh","s-p":"sp","s-new":"snew","s-use":"suse","s-off":"soff","s-x":"sclose","h-tts":"htts","p-tts":"ptts","l-sample":"lsample","l-txt":"ltxt","l-voice":"lvoice","l-rate":"lrate",play:"bplay",pause:"bpause",stop:"bstop","h-file":"hfile","p-file":"pfile","l-file":"lfile",foot:"foot"};
  for(var k in m)$(k).textContent=tx(m[k]);
  $("q").placeholder=tx("search");
  var c=$("fmt").children;for(var i=0;i<c.length;i++)c[i].textContent=tx(c[i].dataset.f);
  $("sample").options[3].textContent=tx("own");
  buildAuthors();loadVoices();
}
$("q").addEventListener("input",function(e){st.q=e.target.value;st.limit=PAGE;render()});
$("author").addEventListener("change",function(e){st.au=e.target.value;st.limit=PAGE;render()});
$("type").addEventListener("change",function(e){st.ty=e.target.value;st.limit=PAGE;render()});
$("era").addEventListener("change",function(e){st.er=e.target.value;st.limit=PAGE;render()});
$("sort").addEventListener("change",function(e){st.so=e.target.value;st.limit=PAGE;render()});
$("clear").addEventListener("click",function(){
  st.q="";st.au="all";st.ty="all";st.er="all";st.so="0";st.f="all";st.limit=PAGE;
  $("q").value="";[].forEach.call($("fmt").children,function(c){c.setAttribute("aria-pressed",c.dataset.f==="all")});
  buildAuthors();render();
});
$("more").addEventListener("click",function(){st.limit+=PAGE;render()});
$("fmt").addEventListener("click",function(e){var b=e.target.closest(".chip");if(!b)return;st.f=b.dataset.f;st.limit=PAGE;[].forEach.call($("fmt").children,function(c){c.setAttribute("aria-pressed",c===b)});render()});
$("grid").addEventListener("click",function(e){
  var f=e.target.closest(".fav");if(!f)return;
  var k=st.saved.indexOf(f.dataset.id);if(k<0)st.saved.push(f.dataset.id);else st.saved.splice(k,1);
  saveLS("rv.saved",st.saved);render();
});
$("grid").addEventListener("change",function(e){
  var s=e.target.closest("select[data-pid]");if(!s)return;
  var id=s.dataset.pid,v=s.value,cur=prog(id);
  st.prog[id]={s:v,p:v==="done"?100:v==="todo"?0:(cur.p||0),t:Date.now()};
  if(v==="todo")delete st.prog[id];
  saveLS("rv.prog",st.prog);render();
});
$("grid").addEventListener("input",function(e){
  var r=e.target.closest("input[data-rid]");if(!r)return;
  var id=r.dataset.rid,p=+r.value;
  st.prog[id]={s:p>=100?"done":"reading",p:p,t:Date.now()};
  r.nextElementSibling.textContent=p+"%";
  saveLS("rv.prog",st.prog);renderCont();
});
$("grid").addEventListener("change",function(e){
  var r=e.target.closest("input[data-rid]");if(r)render();
});
$("lang").addEventListener("click",function(){st.lang=st.lang==="vi"?"en":"vi";try{localStorage.setItem("rv.lang",st.lang)}catch(e){}labels();render()});
$("theme").addEventListener("click",function(){var r=document.documentElement,d=r.getAttribute("data-theme")==="dark"||(!r.getAttribute("data-theme")&&matchMedia("(prefers-color-scheme:dark)").matches);r.setAttribute("data-theme",d?"light":"dark")});

$("exp").addEventListener("click",function(){
  var blob=new Blob([JSON.stringify({v:1,saved:st.saved,prog:st.prog})],{type:"application/json"}),a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download="reformed-vietnam-progress.json";document.body.appendChild(a);a.click();a.remove();
});
$("imp").addEventListener("click",function(){$("impf").click()});
$("impf").addEventListener("change",function(){
  var f=this.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){try{
    var d=JSON.parse(r.result);if(!d||typeof d.prog!=="object"||!Array.isArray(d.saved))throw 0;
    st.prog=d.prog;st.saved=d.saved;saveLS("rv.prog",st.prog);saveLS("rv.saved",st.saved);render();alert(tx("impok"));
  }catch(e){alert(tx("imperr"))}};r.readAsText(f);this.value="";
});


/* sync */
(function(){
var API="api/sync",K="rv.sync",st2=$("s-st"),busy=0,timer;
function code(){try{return localStorage.getItem(K)||""}catch(e){return""}}
function merge(r){
  var ch=0;(r.saved||[]).forEach(function(id){if(st.saved.indexOf(id)<0){st.saved.push(id);ch=1}});
  var rp=r.prog||{};for(var id in rp){var l=st.prog[id];if(!l||(rp[id].t||0)>(l.t||0)){st.prog[id]=rp[id];ch=1}}
  if(ch){saveLS("rv.saved",st.saved);saveLS("rv.prog",st.prog);render();renderCont()}
}
function pull(c){return fetch(API+"?c="+c).then(function(r){if(!r.ok)throw 0;return r.json()}).then(merge)}
function push(c){return fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({c:c,saved:st.saved,prog:st.prog})}).then(function(r){if(!r.ok)throw 0})}
function run(){var c=code();if(!c||busy)return Promise.resolve();busy=1;
  return pull(c).then(function(){return push(c)}).then(function(){st2.textContent=tx("sok")}).catch(function(){st2.textContent=tx("serr")}).then(function(){busy=0})}
function later(){clearTimeout(timer);timer=setTimeout(run,4000)}
var _s=window.saveLS;window.saveLS=function(k,v){_s(k,v);if(code()&&(k==="rv.prog"||k==="rv.saved"))later()};
function ui(){var c=code();$("s-code").value=c;$("s-off").hidden=!c;$("s-code").placeholder="xxxxxxxxxxxxxxxxxxxx"}
$("sync").addEventListener("click",function(){ui();st2.textContent="";$("sdlg").showModal()});
$("s-new").addEventListener("click",function(){
  var a=new Uint8Array(24);crypto.getRandomValues(a);var c="";for(var i=0;i<a.length;i++)c+="abcdefghjkmnpqrstuvwxyz23456789"[a[i]%31];
  $("s-code").value=c});
$("s-use").addEventListener("click",function(){
  var c=$("s-code").value.trim().toLowerCase();if(!/^[a-z0-9]{20,40}$/.test(c)){st2.textContent=tx("sbad");return}
  try{localStorage.setItem(K,c)}catch(e){}$("s-off").hidden=false;run()});
$("s-off").addEventListener("click",function(){try{localStorage.removeItem(K)}catch(e){}$("s-code").value="";$("s-off").hidden=true;st2.textContent=""});
if(code())run();
})();

/* text to speech */
var syn=window.speechSynthesis,voices=[];
SAMPLES.forEach(function(s,i){var o=document.createElement("option");o.value=i;o.textContent=s.n;$("sample").appendChild(o)});
$("txt").value=SAMPLES[0].t;
$("sample").addEventListener("change",function(){$("txt").value=SAMPLES[+this.value].t;$("txt").focus()});
function loadVoices(){
  if(!syn){$("tts").textContent=tx("nosyn");return}
  voices=syn.getVoices().filter(function(v){return/^(en|vi)/i.test(v.lang)});
  $("voice").innerHTML=voices.map(function(v,i){return'<option value="'+i+'">'+esc(v.name)+' ('+v.lang+')</option>'}).join("")||"<option>Default</option>";
}
if(syn)syn.onvoiceschanged=loadVoices;
$("rate").addEventListener("input",function(){$("rateVal").textContent=(+this.value).toFixed(1)+"x"});
$("play").addEventListener("click",function(){
  if(!syn)return;var t=$("txt").value.trim();if(!t){$("tts").textContent=tx("addtext");return}
  if(syn.paused&&syn.speaking){syn.resume();$("tts").textContent=tx("playing");return}
  syn.cancel();var u=new SpeechSynthesisUtterance(t);u.rate=+$("rate").value;
  var v=voices[+$("voice").value];if(v){u.voice=v;u.lang=v.lang}
  u.onend=function(){$("tts").textContent=tx("fin")};u.onerror=function(){$("tts").textContent=tx("stopped")};
  syn.speak(u);$("tts").textContent=tx("playing");
});
$("pause").addEventListener("click",function(){if(syn&&syn.speaking){syn.pause();$("tts").textContent=tx("paused")}});
$("stop").addEventListener("click",function(){if(syn){syn.cancel();$("tts").textContent=tx("stopped")}});
$("file").addEventListener("change",function(){var f=this.files[0];if(!f)return;var p=$("player");p.src=URL.createObjectURL(f);p.hidden=false;$("fileStatus").textContent=f.name+" ("+(f.size/1048576).toFixed(1)+" MB)"});

labels();
Promise.all([fetch("books.json").then(function(r){return r.json()}),fetch("mg.json").then(function(r){return r.json()}).catch(function(){return null}),fetch("vi.json").then(function(r){return r.json()}).catch(function(){return null})]).then(function(x){var d=x[0];if(x[2]){d.vi=d.vi||{};for(var k in x[2])d.vi[k]=x[2][k]}if(x[1]){d.mg=x[1];d.extra=(d.extra||[]).concat(x[1].vn||[])}BOOKS=expand(d);buildAuthors();render()}).catch(function(){$("grid").innerHTML='<div class="empty">books.json</div>'});
</script>
