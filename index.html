<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reformed Vietnam · Thư viện</title>
<meta name="description" content="Thư viện sách và sách nói miễn phí về thần học Cải Chánh. Free Reformed ebooks and audiobooks.">
<meta property="og:type" content="website"><meta property="og:title" content="Reformed Vietnam · Thư viện sách Cải Chánh miễn phí"><meta property="og:description" content="Hơn 3.500 sách và tài liệu thần học Cải Chánh: đọc, tải, theo dõi tiến độ. Free Reformed books and creeds, with Vietnamese resources."><meta name="theme-color" content="#9a3412">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap">
<link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="canonical" href="https://reformed-vietnam.vercel.app/"><meta name="twitter:card" content="summary"><meta property="og:url" content="https://reformed-vietnam.vercel.app/"><meta property="og:site_name" content="Reformed Vietnam">
<link rel="stylesheet" href="style.css">
</head>
<body>
<dialog id="sdlg"><form method="dialog" style="display:grid;gap:10px;min-width:min(340px,80vw)"><b id="s-h"></b><p id="s-p" style="margin:0;font-size:14px"></p>
<input id="s-code" autocomplete="off" spellcheck="false" style="padding:8px;font:16px monospace;background:var(--bg);border:1px solid var(--line);border-radius:8px"><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="s-new" type="button"></button><button class="btn primary" id="s-use" type="button"></button><button class="btn" id="s-off" type="button"></button><button class="btn" id="s-x" value="x"></button></div><p id="s-st" style="margin:0;font-size:13px"></p></form></dialog>
<div class="wrap">
<nav class="nav">
  <span class="brand"><i></i>Reformed <b>Vietnam</b></span>
  <button class="btn" id="lang" type="button"></button>
  <button class="btn" id="theme" type="button"></button>
  <details class="menu"><summary class="btn" id="menu">⋯</summary><div class="pop">
    <button class="btn" id="sync" type="button"></button><button class="btn" id="exp" type="button"></button><button class="btn" id="imp" type="button"></button><a class="btn" id="about" href="about.html"></a>
  </div></details>
  <input type="file" id="impf" accept="application/json" hidden>
</nav>
<header class="hero">
  <h1 id="h1"></h1>
  <p class="lede" id="lede"></p>
  <div class="search"><input type="search" id="q" aria-label="Search"></div>
</header>
<div class="bar">
  <select id="author" aria-label="Author"></select>
  <select id="type" aria-label="Type"></select>
  <select id="era" aria-label="Era"></select>
  <select id="sort" aria-label="Sort"></select>
  <button class="btn" id="clear" type="button" hidden></button>
  <div class="chips" id="fmt" role="group">
    <button class="chip" type="button" data-f="start" aria-pressed="false"></button>
    <button class="chip" type="button" data-f="all" aria-pressed="true"></button>
    <button class="chip" type="button" data-f="reading" aria-pressed="false"></button>
    <button class="chip" type="button" data-f="done" aria-pressed="false"></button>
    <button class="chip" type="button" data-f="saved" aria-pressed="false"></button>
  </div>
  <span class="count" id="count"></span>
</div>
<main>
  <div class="cont" id="cont" hidden></div>
  <div class="grid" id="grid" aria-live="polite"></div>
  <div class="more"><button class="btn" id="more" type="button" hidden></button></div>
  <details class="tts"><summary id="h-tts"></summary>
  <div class="desk">
    <div class="panel">
      <p class="hint" id="p-tts"></p>
      <label for="sample" id="l-sample"></label><select id="sample"></select>
      <label for="txt" id="l-txt"></label><textarea id="txt"></textarea>
      <label for="voice" id="l-voice"></label><select id="voice"></select>
      <label for="rate"><span id="l-rate"></span> <span id="rateVal">1.0x</span></label>
      <input type="range" id="rate" min="0.6" max="1.6" step="0.1" value="1">
      <div class="row"><button class="btn primary" id="play" type="button"></button><button class="btn" id="pause" type="button"></button><button class="btn" id="stop" type="button"></button></div>
      <div class="status" id="tts"></div>
    </div>
    <div class="panel">
      <h2 id="h-file"></h2><p class="hint" id="p-file"></p>
      <label for="file" id="l-file"></label><input type="file" id="file" accept="audio/*">
      <audio id="player" controls hidden></audio>
      <div class="status" id="fileStatus"></div>
    </div>
  </div></details>
</main>
<p class="foot" id="foot"></p>
</div>
<script src="app.js"></script>
</body>
</html>
