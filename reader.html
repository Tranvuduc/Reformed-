<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reader · Reformed Vietnam</title>
<style>
:root{--bg:#faf7f0;--fg:#22201c;--mut:#7a7466;--ac:#8a3b1f;--ln:#e2dccd}
[data-t=dark]{--bg:#17150f;--fg:#e8e2d2;--mut:#9a9482;--ac:#e0946c;--ln:#332f24}
[data-t=sepia]{--bg:#f1e6cc;--fg:#3b2f1d;--mut:#7c6a4a;--ac:#8a3b1f;--ln:#d9c9a4}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:Georgia,"Times New Roman",serif}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--ln);padding:8px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;z-index:2;font:14px system-ui,sans-serif}
header a,header button,header select{color:var(--fg);background:none;border:1px solid var(--ln);border-radius:6px;padding:5px 10px;font:inherit;text-decoration:none;cursor:pointer}
header #vo{max-width:120px;text-overflow:ellipsis}
header .sp{flex:1}#bar{height:3px;background:var(--ln)}#bar i{display:block;height:100%;background:var(--ac);width:0}
main{max-width:42rem;margin:0 auto;padding:24px 16px 80px;font-size:var(--fs,19px);line-height:1.7}
main p{margin:0 0 1em;white-space:pre-wrap;overflow-wrap:anywhere}main h2{font-size:1.3em;margin:1.6em 0 .6em;color:var(--ac)}
#trs{font:13px system-ui,sans-serif;color:var(--mut);margin:0 0 14px;padding:8px 10px;border:1px dashed var(--ln);border-radius:6px}.orig{display:block;font-size:.8em;opacity:.6;margin-top:.3em}nav.pg{display:flex;justify-content:space-between;align-items:center;margin-top:24px;font:14px system-ui,sans-serif;color:var(--mut)}
nav.pg button{font:inherit;padding:8px 16px;border:1px solid var(--ln);border-radius:6px;background:none;color:var(--fg);cursor:pointer}
nav.pg button:disabled{opacity:.4}#all{display:none}@media print{header,#bar,nav.pg,#msg,#txt{display:none!important}#all{display:block}body{background:#fff;color:#000}main{padding:0;max-width:none;font-size:12pt}}#msg{font:15px system-ui,sans-serif;color:var(--mut);padding:40px 0}
</style></head><body>
<header><a href="./" id="back">← Library</a><b id="ttl" style="font:600 14px system-ui"></b><span class="sp"></span>
<button id="tr" title="Translate to Vietnamese (free, machine)">EN</button><button id="au" aria-label="Listen" title="Listen">🔊</button><select id="vo" aria-label="Voice" title="Voice"><option value="">Auto</option></select><select id="sp" aria-label="Speed"><option value="0.8">0.8×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option></select><button id="ep" title="Download EPUB">EPUB</button><button id="pd" title="Save as PDF">PDF</button>
<button id="fm" aria-label="Smaller">A−</button><button id="fp" aria-label="Larger">A+</button><button id="th">◐</button></header>
<div id="bar"><i></i></div>
<main><div id="trs" hidden></div><div id="msg">Loading…</div><div id="txt"></div><div id="all"></div>
<nav class="pg" id="nav" hidden><button id="pv">←</button><span id="pn"></span><button id="nx">→</button></nav></main>
<script>
(function(){
var q=new URLSearchParams(location.search),id=q.get("id")||"",$=function(x){return document.getElementById(x)};
var PAGE=4500,pages=[],cur=0;
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){}}
var fs=+ls("rv.fs")||19,th=ls("rv.th")||"light";
function apply(){document.documentElement.style.setProperty("--fs",fs+"px");document.documentElement.setAttribute("data-t",th)}apply();
$("fm").onclick=function(){fs=Math.max(14,fs-1);ls("rv.fs",fs);apply()};
$("fp").onclick=function(){fs=Math.min(30,fs+1);ls("rv.fs",fs);apply()};
$("th").onclick=function(){th=th==="light"?"sepia":th==="sepia"?"dark":"light";ls("rv.th",th);apply()};
var name=id.split("/")[1]||"";$("ttl").textContent=name;document.title=name+" · Reformed Vietnam";
var ext="https://ccel.org/ccel/"+id+"/"+name;
function fail(){$("msg").innerHTML='Could not load this book here. <a href="'+ext+'" target="_blank" rel="noopener">Open it on CCEL</a>.'}
function esc(s){return s.replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function split(t){
  t=t.replace(/\r/g,"").replace(/\n{3,}/g,"\n\n");
  var paras=t.split(/\n\n+/),out=[],b="";
  paras.forEach(function(p){ if(b.length+p.length>PAGE&&b){out.push(b);b=""} b+=(b?"\n\n":"")+p; });
  if(b)out.push(b);return out;
}
/* Translate to Vietnamese: Chrome built-in Translator (on-device) first, then free web services. Machine translation, may contain errors. */
var trm=ls("rv.trm")||"0",tpage={},trp={},trTok=0,natT=null,dead={};
function splitC(t,max){var out=[],cur="";t.split(/(?<=[.!?;:])\s+/).forEach(function(x){while(x.length>max){if(cur){out.push(cur);cur=""}var k=x.lastIndexOf(" ",max);if(k<200)k=max;out.push(x.slice(0,k));x=x.slice(k).trim()}if(cur&&cur.length+x.length+1>max){out.push(cur);cur=""}cur+=(cur?" ":"")+x});if(cur)out.push(cur);return out}
function tmo(p,ms){return Promise.race([p,new Promise(function(_,r){setTimeout(function(){r(new Error("timeout"))},ms)})])}
async function tr1(t){
  if(!dead.nat&&self.Translator){try{if(!natT){var av=await tmo(self.Translator.availability({sourceLanguage:"en",targetLanguage:"vi"}),3000);if(av!=="available")throw 0;natT=await tmo(self.Translator.create({sourceLanguage:"en",targetLanguage:"vi"}),5000)}return await tmo(natT.translate(t),20000)}catch(e){dead.nat=1}}
  if(!dead.gtx){try{var r=await tmo(fetch("https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=vi&dt=t&q="+encodeURIComponent(t)),15000);if(!r.ok)throw 0;var j=await r.json();var o=j[0].map(function(x){return x[0]}).join("");if(!o)throw 0;return o}catch(e){dead.gtx=1}}
  if(!dead.mm){try{var r2=await tmo(fetch("https://api.mymemory.translated.net/get?langpair=en|vi&q="+encodeURIComponent(t.slice(0,480))),15000);if(!r2.ok)throw 0;var j2=await r2.json();if(j2.responseStatus!=200)throw 0;return j2.responseData.translatedText}catch(e){dead.mm=1}}
  throw new Error("no translator")
}
async function trText(t){var out=[],c=splitC(t,dead.gtx&&dead.nat?470:900);for(var i=0;i<c.length;i++)out.push(await tr1(c[i]));return out.join(" ")}
function trKey(i){return"rv.tr."+id+"."+i}
function runTr(i){
  var tok=++trTok,els=[].slice.call($("txt").children),src=pages[i].split(/\n\n/).map(function(p){return p.trim()}).filter(Boolean);
  var st=$("trs");st.hidden=false;
  var cached=null;try{cached=JSON.parse(ls(trKey(i))||"null")}catch(e){}
  var paint=function(k,v){var e=els[k];if(!e)return;e.innerHTML=esc(v)+(trm==="2"?'<span class="orig">'+esc(src[k])+"</span>":"")};
  if(cached&&cached.length===src.length){cached.forEach(function(v,k){paint(k,v)});tpage[i]=cached.join("\n\n");st.textContent="Bản dịch máy · Machine translation — có thể sai sót.";return Promise.resolve()}
  var res=[],k=0;st.textContent="Đang dịch… / Translating…";
  return(async function(){
    for(;k<src.length;k++){
      if(tok!==trTok)return;
      var v=await trText(src[k]);if(tok!==trTok)return;res.push(v);paint(k,v);st.textContent="Đang dịch… "+(k+1)+"/"+src.length;
    }
    tpage[i]=res.join("\n\n");st.textContent="Bản dịch máy · Machine translation — có thể sai sót.";
    try{ls(trKey(i),JSON.stringify(res))}catch(e){}
  })().catch(function(){if(tok===trTok){st.innerHTML='Translation service unavailable. <a href="https://translate.google.com/?sl=en&tl=vi&op=translate" target="_blank" rel="noopener">Open Google Translate</a> or try again later.'}});
}
function setTr(m){trm=m;ls("rv.trm",m);$("tr").textContent=m==="0"?"EN":m==="1"?"VI":"EN+VI";if(m==="0"){$("trs").hidden=true;trTok++}show(cur,false)}
$("tr").textContent=trm==="0"?"EN":trm==="1"?"VI":"EN+VI";
$("tr").onclick=function(){setTr(trm==="0"?"1":trm==="1"?"2":"0")};
function show(i,top){
  cur=Math.max(0,Math.min(pages.length-1,i));
  $("txt").innerHTML=pages[cur].split(/\n\n/).map(function(p){
    var s=p.trim();if(!s)return"";
    return(s.length<80&&!/[.,;:]$/.test(s)&&/^[A-Z0-9IVXL]/.test(s))?"<h2>"+esc(s)+"</h2>":"<p>"+esc(s)+"</p>";
  }).join("");
  trTok++;if(trm!=="0")trp[cur]=runTr(cur);else $("trs").hidden=true;
  $("pn").textContent=(cur+1)+" / "+pages.length;$("pv").disabled=cur===0;$("nx").disabled=cur===pages.length-1;
  var pct=pages.length>1?Math.round(cur/(pages.length-1)*100):100;$("bar").firstChild.style.width=pct+"%";
  ls("rv.pos."+id,cur);save(pct);if(top!==false)window.scrollTo(0,0);
}
function save(pct){
  try{
    var p=JSON.parse(ls("rv.prog")||"{}");
    if(pct<=0&&!p[id])return;
    p[id]={s:pct>=100?"done":"reading",p:Math.min(100,Math.round(pct/5)*5),t:Date.now()};
    ls("rv.prog",JSON.stringify(p));
  }catch(e){}
}
$("pv").onclick=function(){show(cur-1)};$("nx").onclick=function(){show(cur+1)};
document.addEventListener("keydown",function(e){if(e.key==="ArrowRight")show(cur+1);if(e.key==="ArrowLeft")show(cur-1)});

/* Audio: read the current page aloud with the device voice, then move on. */
var playing=false,queue=[],qi=0,VOICES=[],keep=null;
function chunks(t){var out=[];t.replace(/\s+/g," ").split(/(?<=[.!?;:])\s+/).forEach(function(x){while(x.length>220){var k=x.lastIndexOf(" ",220);if(k<80)k=220;out.push(x.slice(0,k));x=x.slice(k)}if(x.trim())out.push(x)});return out}
var VI=/[àáảãạăằắẳẵặâầấẩẫậèéẻẽẹêềếểễệìíỉĩịòóỏõọôồốổỗộơờớởỡợùúủũụưừứửữựỳýỷỹỵđ]/i;
function lgOf(t){return VI.test(t)?"vi":"en"}
/* Rank voices: neural/online/natural first, then Google, then local. */
function score(v){var n=v.name,s=0;if(/natural|neural/i.test(n))s+=50;if(/online/i.test(n))s+=30;if(/google/i.test(n))s+=20;if(/siri|premium|enhanced/i.test(n))s+=25;if(/compact|espeak/i.test(n))s-=20;if(!v.localService)s+=5;return s}
function loadVoices(){
  var all=speechSynthesis.getVoices();if(!all.length&&!$("vo").options.length)return;
  VOICES=all.filter(function(v){return /^(en|vi)/i.test(v.lang)}).sort(function(a,b){return score(b)-score(a)});
  var sel=$("vo"),keepv=ls("rv.voice")||"";sel.innerHTML='<option value="">Auto</option><option value="piper">🧠 Piper AI (offline, ~60MB)</option>';
  VOICES.forEach(function(v){var o=document.createElement("option");o.value=v.name;o.textContent=v.name.replace(/^Microsoft |^Google /,"")+" ("+v.lang+")";sel.appendChild(o)});
  sel.value=keepv;if(sel.value!==keepv)sel.value="";
}
function pick(lg){
  var pref=ls("rv.voice"),p=VOICES.filter(function(v){return v.lang.toLowerCase().indexOf(lg)===0});
  if(pref){var m=VOICES.filter(function(v){return v.name===pref&&v.lang.toLowerCase().indexOf(lg)===0})[0];if(m)return m}
  if(lg==="en"){var us=p.filter(function(v){return /^en[-_](us|gb)/i.test(v.lang)});if(us.length)return us[0]}
  return p[0]||null;
}
/* Piper: free neural voice that runs in the browser (WASM). Downloads a ~60MB model once, then works offline. */
var PV={en:"en_US-lessac-medium",vi:"vi_VN-vais1000-medium"},pmod=null,pc={},paudio=new Audio(),pfail=0;
function pLoad(){return pmod||(pmod=import("https://cdn.jsdelivr.net/npm/@mintplex-labs/piper-tts-web@1.0.4/+esm"))}
function pSynth(t){var lg=lgOf(t),k=lg+t;if(!pc[k]){var ks=Object.keys(pc);if(ks.length>6)delete pc[ks[0]];pc[k]=pLoad().then(function(m){return m.predict({text:t,voiceId:PV[lg]})})}return pc[k]}
function speakPiper(){
  var t=queue[qi++];if(queue[qi])pSynth(queue[qi]).catch(function(){});
  $("au").textContent="…";
  pSynth(t).then(function(b){if(!playing)return;$("au").textContent="⏸";var u=URL.createObjectURL(b);paudio.src=u;paudio.playbackRate=+$("sp").value;
    paudio.onended=function(){URL.revokeObjectURL(u);speak()};paudio.onerror=function(){URL.revokeObjectURL(u);speak()};return paudio.play()})
  .catch(function(e){if(!playing)return;if(++pfail>=2){ls("rv.voice","");$("vo").value="";alert("Piper voice could not load (network or browser). Using the device voice.");qi=Math.max(0,qi-1);speak()}else{pc={};qi=Math.max(0,qi-1);setTimeout(speak,800)}});
}
function srcText(){return trm!=="0"&&tpage[cur]?tpage[cur]:pages[cur]}
function nextQ(cb){Promise.resolve(trm!=="0"?trp[cur]:null).then(function(){if(!playing)return;queue=chunks(srcText());qi=0;cb()})}
function speak(){
  if(!playing)return;
  if(qi>=queue.length){if(cur<pages.length-1){show(cur+1);nextQ(speak)}else stopA();return}
  if(ls("rv.voice")==="piper"){speakPiper();return}
  var t=queue[qi++],lg=lgOf(t),v=pick(lg),u=new SpeechSynthesisUtterance(t);
  u.rate=+$("sp").value;u.lang=v?v.lang:(lg==="vi"?"vi-VN":"en-US");if(v)u.voice=v;
  u.onend=function(){setTimeout(speak,/[.!?]$/.test(t)?120:40)};
  u.onerror=function(e){if(e.error!=="interrupted"&&e.error!=="canceled")stopA()};speechSynthesis.speak(u);
}
function startA(){pfail=0;if(!window.speechSynthesis||!pages.length){alert("No speech voice available on this device.");return}playing=true;$("au").textContent="⏸";speechSynthesis.cancel();loadVoices();nextQ(speak);
  clearInterval(keep);keep=setInterval(function(){if(playing&&speechSynthesis.speaking&&!speechSynthesis.paused){speechSynthesis.pause();speechSynthesis.resume()}},12000)}
function stopA(){playing=false;try{paudio.pause()}catch(e){}clearInterval(keep);$("au").textContent="🔊";speechSynthesis.cancel()}
if(window.speechSynthesis){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
$("vo").onchange=function(){try{localStorage.setItem("rv.voice",$("vo").value)}catch(e){}if(playing){var k=Math.max(0,qi-1);speechSynthesis.cancel();try{paudio.pause()}catch(e){}qi=k;speak()}};
$("au").onclick=function(){playing?stopA():startA()};
$("sp").onchange=function(){if(ls("rv.voice")==="piper"){paudio.playbackRate=+$("sp").value;return}if(playing){var k=Math.max(0,qi-1);speechSynthesis.cancel();qi=k;speak()}};
window.addEventListener("beforeunload",function(){try{speechSynthesis.cancel()}catch(e){}});
/* PDF: render the whole book into a print-only block and open the print dialog. */
$("pd").onclick=function(){
  if(!pages.length)return;var b=$("all");
  b.innerHTML="<h1>"+esc(name)+"</h1>"+pages.map(function(pg){return pg.split(/\n\n/).map(function(x){x=x.trim();return x?"<p>"+esc(x)+"</p>":""}).join("")}).join("");
  window.print();
};
/* EPUB: build a valid EPUB 3 in the browser from the loaded text. */
function loadZip(){return new Promise(function(ok,no){if(window.JSZip)return ok();var s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js";s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
$("ep").onclick=function(){
  if(!pages.length)return;var btn=$("ep");btn.textContent="…";
  loadZip().then(function(){
    var z=new JSZip(),G=12,chs=[];
    for(var i=0;i<pages.length;i+=G)chs.push(pages.slice(i,i+G).join("\n\n"));
    var x=function(t){return '<?xml version="1.0" encoding="utf-8"?><html xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops"><head><title>'+esc(name)+'</title></head><body>'+t+'</body></html>'};
    z.file("mimetype","application/epub+zip",{compression:"STORE"});
    z.file("META-INF/container.xml",'<?xml version="1.0"?><container version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container"><rootfiles><rootfile full-path="OEBPS/content.opf" media-type="application/oebps-package+xml"/></rootfiles></container>');
    var man="",spine="",toc="";
    chs.forEach(function(c,n){var f="c"+n+".xhtml";
      z.file("OEBPS/"+f,x("<h2>Part "+(n+1)+"</h2>"+c.split(/\n\n/).map(function(p){p=p.trim();return p?"<p>"+esc(p)+"</p>":""}).join("")));
      man+='<item id="c'+n+'" href="'+f+'" media-type="application/xhtml+xml"/>';spine+='<itemref idref="c'+n+'"/>';toc+='<li><a href="'+f+'">Part '+(n+1)+"</a></li>"});
    z.file("OEBPS/nav.xhtml",x('<nav epub:type="toc"><h1>Contents</h1><ol>'+toc+"</ol></nav>"));
    z.file("OEBPS/content.opf",'<?xml version="1.0" encoding="utf-8"?><package xmlns="http://www.idpf.org/2007/opf" version="3.0" unique-identifier="u"><metadata xmlns:dc="http://purl.org/dc/elements/1.1/"><dc:identifier id="u">rv-'+esc(id)+'</dc:identifier><dc:title>'+esc(name)+'</dc:title><dc:language>en</dc:language><meta property="dcterms:modified">'+new Date().toISOString().slice(0,19)+'Z</meta></metadata><manifest><item id="nav" href="nav.xhtml" media-type="application/xhtml+xml" properties="nav"/>'+man+'</manifest><spine>'+spine+'</spine></package>');
    return z.generateAsync({type:"blob",mimeType:"application/epub+zip"});
  }).then(function(bl){var a=document.createElement("a");a.href=URL.createObjectURL(bl);a.download=name+".epub";document.body.appendChild(a);a.click();a.remove();btn.textContent="EPUB"}).catch(function(){btn.textContent="EPUB";alert("Could not build the EPUB.")});
};
if(!/^[a-z0-9_-]+\/[a-z0-9_.-]+$/i.test(id)){fail();return}
fetch("api/text?id="+encodeURIComponent(id)).then(function(r){if(!r.ok)throw 0;return r.text()}).then(function(t){
  if(t.length<500)throw 0;pages=split(t);$("msg").remove();$("nav").hidden=false;
  show(+ls("rv.pos."+id)||0,false);
}).catch(fail);
})();
</script></body></html>
