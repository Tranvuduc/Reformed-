<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reader · Reformed Vietnam</title>
<style>
:root{--bg:#faf7f0;--fg:#22201c;--mut:#7a7466;--ac:#8a3b1f;--ln:#e2dccd}
[data-t=dark]{--bg:#17150f;--fg:#e8e2d2;--mut:#9a9482;--ac:#e0946c;--ln:#332f24}
[data-t=sepia]{--bg:#f1e6cc;--fg:#3b2f1d;--mut:#7c6a4a;--ac:#8a3b1f;--ln:#d9c9a4}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:Georgia,"Times New Roman",serif}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--ln);padding:8px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;z-index:2;font:14px system-ui,sans-serif}
header a,header button,header select{color:var(--fg);background:none;border:1px solid var(--ln);border-radius:6px;padding:5px 10px;font:inherit;text-decoration:none;cursor:pointer}
header .sp{flex:1}#bar{height:3px;background:var(--ln)}#bar i{display:block;height:100%;background:var(--ac);width:0}
main{max-width:42rem;margin:0 auto;padding:24px 16px 80px;font-size:var(--fs,19px);line-height:1.7}
main p{margin:0 0 1em;white-space:pre-wrap;overflow-wrap:anywhere}main h2{font-size:1.3em;margin:1.6em 0 .6em;color:var(--ac)}
nav.pg{display:flex;justify-content:space-between;align-items:center;margin-top:24px;font:14px system-ui,sans-serif;color:var(--mut)}
nav.pg button{font:inherit;padding:8px 16px;border:1px solid var(--ln);border-radius:6px;background:none;color:var(--fg);cursor:pointer}
nav.pg button:disabled{opacity:.4}#msg{font:15px system-ui,sans-serif;color:var(--mut);padding:40px 0}
</style></head><body>
<header><a href="./" id="back">← Library</a><b id="ttl" style="font:600 14px system-ui"></b><span class="sp"></span>
<button id="fm" aria-label="Smaller">A−</button><button id="fp" aria-label="Larger">A+</button><button id="th">◐</button></header>
<div id="bar"><i></i></div>
<main><div id="msg">Loading…</div><div id="txt"></div>
<nav class="pg" id="nav" hidden><button id="pv">←</button><span id="pn"></span><button id="nx">→</button></nav></main>
<script>
(function(){
var q=new URLSearchParams(location.search),id=q.get("id")||"",$=function(x){return document.getElementById(x)};
var PAGE=4500,pages=[],cur=0;
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){}}
var fs=+ls("rv.fs")||19,th=ls("rv.th")||"light";
function apply(){document.documentElement.style.setProperty("--fs",fs+"px");document.documentElement.setAttribute("data-t",th)}apply();
$("fm").onclick=function(){fs=Math.max(14,fs-1);ls("rv.fs",fs);apply()};
$("fp").onclick=function(){fs=Math.min(30,fs+1);ls("rv.fs",fs);apply()};
$("th").onclick=function(){th=th==="light"?"sepia":th==="sepia"?"dark":"light";ls("rv.th",th);apply()};
var name=id.split("/")[1]||"";$("ttl").textContent=name;document.title=name+" · Reformed Vietnam";
var ext="https://ccel.org/ccel/"+id+"/"+name;
function fail(){$("msg").innerHTML='Could not load this book here. <a href="'+ext+'" target="_blank" rel="noopener">Open it on CCEL</a>.'}
function esc(s){return s.replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function split(t){
  t=t.replace(/\r/g,"").replace(/\n{3,}/g,"\n\n");
  var paras=t.split(/\n\n+/),out=[],b="";
  paras.forEach(function(p){ if(b.length+p.length>PAGE&&b){out.push(b);b=""} b+=(b?"\n\n":"")+p; });
  if(b)out.push(b);return out;
}
function show(i,top){
  cur=Math.max(0,Math.min(pages.length-1,i));
  $("txt").innerHTML=pages[cur].split(/\n\n/).map(function(p){
    var s=p.trim();if(!s)return"";
    return(s.length<80&&!/[.,;:]$/.test(s)&&/^[A-Z0-9IVXL]/.test(s))?"<h2>"+esc(s)+"</h2>":"<p>"+esc(s)+"</p>";
  }).join("");
  $("pn").textContent=(cur+1)+" / "+pages.length;$("pv").disabled=cur===0;$("nx").disabled=cur===pages.length-1;
  var pct=pages.length>1?Math.round(cur/(pages.length-1)*100):100;$("bar").firstChild.style.width=pct+"%";
  ls("rv.pos."+id,cur);save(pct);if(top!==false)window.scrollTo(0,0);
}
function save(pct){
  try{
    var p=JSON.parse(ls("rv.prog")||"{}");
    if(pct<=0&&!p[id])return;
    p[id]={s:pct>=100?"done":"reading",p:Math.min(100,Math.round(pct/5)*5),t:Date.now()};
    ls("rv.prog",JSON.stringify(p));
  }catch(e){}
}
$("pv").onclick=function(){show(cur-1)};$("nx").onclick=function(){show(cur+1)};
document.addEventListener("keydown",function(e){if(e.key==="ArrowRight")show(cur+1);if(e.key==="ArrowLeft")show(cur-1)});
if(!/^[a-z0-9_-]+\/[a-z0-9_.-]+$/i.test(id)){fail();return}
fetch("api/text?id="+encodeURIComponent(id)).then(function(r){if(!r.ok)throw 0;return r.text()}).then(function(t){
  if(t.length<500)throw 0;pages=split(t);$("msg").remove();$("nav").hidden=false;
  show(+ls("rv.pos."+id)||0,false);
}).catch(fail);
})();
</script></body></html>
