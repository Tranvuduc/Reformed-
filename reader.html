function splitSentences(text) {
  var out = [], start = 0, i = 0, n = text.length;
  function isTerm(ch) { return ch === "." || ch === "!" || ch === "?" || ch === "…"; }
  function isClose(ch) { return ch === '"' || ch === "”" || ch === "’" || ch === "'" || ch === ")" || ch === "]" || ch === "»"; }
  while (i < n) {
    if (isTerm(text[i])) {
      var j = i + 1;
      while (j < n && (isTerm(text[j]) || isClose(text[j]))) j++;
      if (j >= n || /\s/.test(text[j])) { out.push(text.slice(start, j)); start = j; i = j; continue; }
    }
    i++;
  }
  if (start < n) out.push(text.slice(start));
  return out.map(function (s) { return s.trim(); }).filter(function (s) { return s.length > 0; });
}

var termRegex = new RegExp("(" + termKeys.map(function (t) { return t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }).join("|") + ")", "g");
function markTerms(escapedText) {
  return escapedText.replace(termRegex, function (m) { return '<span class="term" data-term="' + esc(m) + '">' + m + "</span>"; });
}
function sentHTML(t){
  var sents=splitSentences(t),out="",pos=0;
  sents.forEach(function(s,i){
    var idx=t.indexOf(s,pos);if(idx<0)idx=pos;
    out+=esc(t.slice(pos,idx));

    pos=idx+s.length;
  });
  out+=esc(t.slice(pos));
  return out;
}

/* ---------- scroll mode (Kindle-like sample: continuous scroll) ---------- */
var scrPages={first:0,last:-1};
function ensurePage(p){
  if(S.mode!=="scroll")return;
  if(scrPages.last<0){$("txt").innerHTML=pageHTML(p);scrPages.first=p;scrPages.last=p;hlPaint();return}
  while(scrPages.last<p){scrPages.last++;$("txt").insertAdjacentHTML("beforeend",pageHTML(scrPages.last))}
  while(scrPages.first>p){scrPages.first--;var de=document.documentElement,before=de.scrollHeight;$("txt").insertAdjacentHTML("afterbegin",pageHTML(scrPages.first));var added=de.scrollHeight-before;if(added>0)window.scrollBy(0,added)}
  hlPaint();
}
function enterScroll(){
  stopA(true);
  var fk=firstVisibleK();
  $("txt").innerHTML=pageHTML(cur);scrPages={first:cur,last:cur};
  if(cur+1<pages.length){$("txt").insertAdjacentHTML("beforeend",pageHTML(cur+1));scrPages.last=cur+1}
  hlPaint();refreshBookmarkBtn();
  var el=$("txt").querySelector('[data-pg="'+cur+'"][data-k="'+fk+'"]')||$("txt").querySelector('[data-pg="'+cur+'"][data-k="0"]');
  if(el)window.scrollTo(0,Math.max(0,el.getBoundingClientRect().top+scrollY-70));
  updateProgress();
  trTok++;if(trm!=="0")runTr(cur);
}
function exitScroll(){
  var fk=firstVisibleK();
  scrPages={first:0,last:-1};
  render(cur,false);
  var el=$("txt").querySelector('[data-k="'+fk+'"]');
  if(el)window.scrollTo(0,Math.max(0,el.getBoundingClientRect().top+scrollY-70));
}
function setMode(m){
  if(m===S.mode||!pages.length)return;
  S.mode=m;ls("rv.mode",m);apply();
  if(m==="scroll")enterScroll();else exitScroll();
}
var scrTicking=false;
function scrollTick(){
  if(scrTicking)return;scrTicking=true;
  requestAnimationFrame(function(){scrTicking=false;
    var a=anchorEl();
    if(a&&a.dataset.pg!=null){var pg=+a.dataset.pg;if(pg!==cur){cur=pg;ls("rv.pos."+id,cur);if(trm!=="0"){trTok++;runTr(cur)}}}
    var de=document.documentElement;
    if(scrPages.last<pages.length-1&&scrollY+innerHeight>de.scrollHeight-1500)ensurePage(scrPages.last+1);
    if(scrPages.first>0&&scrollY<900)ensurePage(scrPages.first-1);
    updateProgress();
  });
}

function progImport(f){
  var r=new FileReader();
  r.onload=function(){
    var n=0;
    try{
      var o=JSON.parse(r.result),k,x;
      for(k in o){
        if(k.indexOf("rv.")!==0||k==="rv.sync"||typeof o[k]!=="string")continue;
        var ex=localStorage.getItem(k),nv=o[k];
        try{
          var ea=JSON.parse(ex||"null"),na=JSON.parse(nv);
          if(ea&&na&&typeof ea==="object"&&typeof na==="object"){
            if(Array.isArray(ea)&&Array.isArray(na)){
              var seen={},mg=ea.slice();
              ea.forEach(function(h){seen[JSON.stringify(h)]=1});
              na.forEach(function(h){var s2=JSON.stringify(h);if(!seen[s2]){seen[s2]=1;mg.push(h)}});
              nv=JSON.stringify(mg);
            }else if(!Array.isArray(ea)&&!Array.isArray(na)){
              var m2={};for(x in ea)m2[x]=ea[x];for(x in na)m2[x]=na[x];nv=JSON.stringify(m2);
            }
          }
        }catch(e2){}
        if(ex===nv)continue;
        localStorage.setItem(k,nv);n++;
      }
      alert((lang==="vi"?"Đã nhập ":"Imported ")+n+(lang==="vi"?" mục. Tải lại trang để xem.":" items. Reloading."));
      setTimeout(function(){location.reload()},600);
    }catch(e){alert(lang==="vi"?"Tệp không hợp lệ.":"Invalid file.")}
  };
  r.readAsText(f);
}

/* ---------- translate (free services) ---------- */
var natT=null,dead={};
function tmo(p,ms){return Promise.race([p,new Promise(function(_,r){setTimeout(function(){r(new Error("timeout"))},ms)})])}
function splitC(t,max){var out=[],c="";t.split(/(?<=[.!?])\s+(?=[A-Z"“‘(\d])/).forEach(function(x){while(x.length>max){if(c){out.push(c);c=""}var k=x.lastIndexOf(" ",max);if(k<200)k=max;out.push(x.slice(0,k));x=x.slice(k).trim()}if(c&&c.length+x.length+1>max){out.push(c);c=""}c+=(c?" ":"")+x});if(c)out.push(c);return out}
async function tr1(t){
  if(!dead.nat&&self.Translator){try{if(!natT){var av=await tmo(self.Translator.availability({sourceLanguage:"en",targetLanguage:"vi"}),3000);if(av!=="available")throw 0;natT=await tmo(self.Translator.create({sourceLanguage:"en",targetLanguage:"vi"}),5000)}return await tmo(natT.translate(t),20000)}catch(e){dead.nat=1}}
  if(!dead.gtx){try{var r=await tmo(fetch("https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=vi&dt=t&q="+encodeURIComponent(t)),15000);if(!r.ok)throw 0;var j=await r.json();var o=j[0].map(function(x){return x[0]}).join("");if(!o)throw 0;return o}catch(e){dead.gtx=1}}
  if(!dead.mm){try{var r2=await tmo(fetch("https://api.mymemory.translated.net/get?langpair=en|vi&q="+encodeURIComponent(t.slice(0,480))),15000);if(!r2.ok)throw 0;var j2=await r2.json();if(j2.responseStatus!=200)throw 0;return j2.responseData.translatedText}catch(e){dead.mm=1}}
  throw new Error("no translator")
}
async function trText(t){var out=[],c=splitC(t,dead.gtx&&dead.nat?470:1400);for(var i=0;i<c.length;i++)out.push(await tr1(c[i]));return out.join(" ")}
function trKey(i){return"rv.tr."+id+"."+i}
function trCacheGet(i){try{var v=JSON.parse(ls(trKey(i))||"null");return v&&v.length===pages[i].b-pages[i].a?v:null}catch(e){return null}}
function trCachePut(i,arr){
  try{ls(trKey(i),JSON.stringify(arr));var idx=JSON.parse(ls("rv.tr.idx")||"[]");idx=idx.filter(function(k){return k!==trKey(i)});idx.push(trKey(i));
    while(idx.length>40){try{localStorage.removeItem(idx.shift())}catch(e){}}ls("rv.tr.idx",JSON.stringify(idx))}catch(e){}
}
// translate page i with 3 parallel workers; onP(k,text) paints as it goes
function getTr(i,onP,tok){
  var c=trCacheGet(i);if(c){if(onP)c.forEach(function(v,k){onP(k,v)});return Promise.resolve(c)}
  var src=ptexts(i);
  return sharedGet(i,src).then(function(sh){
    if(sh){trCachePut(i,sh);if(onP)sh.forEach(function(v,k){onP(k,v)});return sh}
    if(window.__trBatch)return window.__trBatch(src).then(function(r){if(!Array.isArray(r)||r.length!==src.length)throw 0;trCachePut(i,r);if(onP)r.forEach(function(v,k){onP(k,v)});sharedPut(src,r);return r});
    return getTr2(i,src,onP,tok).then(function(r){sharedPut(src,r);return r});
  });
}
function hsh(a){var s=a.join("\n"),h=5381,h2=0;for(var k=0;k<s.length;k++){h=((h<<5)+h+s.charCodeAt(k))>>>0;h2=(h2*31+s.charCodeAt(k))>>>0}return h.toString(36)+h2.toString(36)}
function sharedGet(i,src){
  if(!src.length||dead.sh)return Promise.resolve(null);
  return tmo(fetch("api/tr?id="+encodeURIComponent(id)+"&h="+hsh(src)),4000).then(function(r){if(!r.ok)return null;return r.json()}).then(function(a){return Array.isArray(a)&&a.length===src.length&&a.every(function(x){return typeof x==="string"})?a:null}).catch(function(){dead.sh=1;return null});
}
function sharedPut(src,res){
  if(dead.sh||!res||res.length!==src.length)return;
  for(var k=0;k<res.length;k++)if(typeof res[k]!=="string"||!res[k].trim())return;
  try{fetch("api/tr",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:id,h:hsh(src),t:res}),keepalive:false}).catch(function(){})}catch(e){}
}
function getTr2(i,src,onP,tok){
  var res=new Array(src.length),next=0,done=0,fatal=false;
  var conc=(!dead.gtx||!dead.nat)&&!dead.mm?3:1;
  return new Promise(function(ok,no){
    function worker(){
      if(fatal||(tok!=null&&tok!==trTok))return;
      var k=next++;if(k>=src.length)return;
      trText(src[k]).then(function(v){res[k]=v;done++;if(onP&&(tok==null||tok===trTok))onP(k,v);if(done===src.length){trCachePut(i,res);ok(res)}else worker()}).catch(function(e){fatal=true;no(e)});
    }
    if(!src.length)return ok([]);
    for(var w=0;w<conc;w++)worker();

function loadText(url){
  return fetch(url).then(function(r){
    if(!r.ok)throw 0;
    var total=+r.headers.get("content-length")||0,got=0;
    var bar=$("msg").querySelector(".rdskel");
    var pw=document.createElement("div");pw.className="rdprog";pw.innerHTML="<i></i><span></span>";
    if(bar)bar.appendChild(pw);
    var rd=r.body.getReader(),dec=new TextDecoder(),chunks=[];
    function pump(){
      return rd.read().then(function(x){
        if(x.done)return chunks.join("");
        chunks.push(dec.decode(x.value,{stream:true}));got+=x.value.length;
        if(total&&pw){var pc=Math.min(99,Math.round(got/total*100));pw.firstChild.style.width=pc+"%";pw.lastChild.textContent=pc+"%"}
        else if(pw){pw.lastChild.textContent=Math.round(got/1024)+" KB"}
        return pump();
      });
    }
    return pump().then(function(t){return t+dec.decode()});
  });
}
