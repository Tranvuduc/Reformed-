/* ---------- translate (free services) ---------- */
var natT=null,dead={};
function tmo(p,ms){return Promise.race([p,new Promise(function(_,r){setTimeout(function(){r(new Error("timeout"))},ms)})])}
function splitC(t,max){var out=[],c="";t.split(/(?<=[.!?;:])\s+/).forEach(function(x){while(x.length>max){if(c){out.push(c);c=""}var k=x.lastIndexOf(" ",max);if(k<200)k=max;out.push(x.slice(0,k));x=x.slice(k).trim()}if(c&&c.length+x.length+1>max){out.push(c);c=""}c+=(c?" ":"")+x});if(c)out.push(c);return out}
async function tr1(t){
  if(!dead.nat&&self.Translator){try{if(!natT){var av=await tmo(self.Translator.availability({sourceLanguage:"en",targetLanguage:"vi"}),3000);if(av!=="available")throw 0;natT=await tmo(self.Translator.create({sourceLanguage:"en",targetLanguage:"vi"}),5000)}return await tmo(natT.translate(t),20000)}catch(e){dead.nat=1}}
  if(!dead.gtx){try{var r=await tmo(fetch("https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=vi&dt=t&q="+encodeURIComponent(t)),15000);if(!r.ok)throw 0;var j=await r.json();var o=j[0].map(function(x){return x[0]}).join("");if(!o)throw 0;return o}catch(e){dead.gtx=1}}
  if(!dead.mm){try{var r2=await tmo(fetch("https://api.mymemory.translated.net/get?langpair=en|vi&q="+encodeURIComponent(t.slice(0,480))),15000);if(!r2.ok)throw 0;var j2=await r2.json();if(j2.responseStatus!=200)throw 0;return j2.responseData.translatedText}catch(e){dead.mm=1}}
  throw new Error("no translator")
}
async function trText(t){var out=[],c=splitC(t,dead.gtx&&dead.nat?470:900);for(var i=0;i<c.length;i++)out.push(await tr1(c[i]));return out.join(" ")}
function trKey(i){return"rv.tr."+id+"."+i}
function trCacheGet(i){try{var v=JSON.parse(ls(trKey(i))||"null");return v&&v.length===pages[i].b-pages[i].a?v:null}catch(e){return null}}
function trCachePut(i,arr){
  try{ls(trKey(i),JSON.stringify(arr));var idx=JSON.parse(ls("rv.tr.idx")||"[]");idx=idx.filter(function(k){return k!==trKey(i)});idx.push(trKey(i));
    while(idx.length>40){try{localStorage.removeItem(idx.shift())}catch(e){}}ls("rv.tr.idx",JSON.stringify(idx))}catch(e){}
}
// translate page i with 3 parallel workers; onP(k,text) paints as it goes
function getTr(i,onP,tok){
  var c=trCacheGet(i);if(c){if(onP)c.forEach(function(v,k){onP(k,v)});return Promise.resolve(c)}
  var src=ptexts(i);
  return sharedGet(i,src).then(function(sh){
    if(sh){trCachePut(i,sh);if(onP)sh.forEach(function(v,k){onP(k,v)});return sh}
    return getTr2(i,src,onP,tok).then(function(r){sharedPut(src,r);return r});
  });
}
function hsh(a){var s=a.join("\n"),h=5381,h2=0;for(var k=0;k<s.length;k++){h=((h<<5)+h+s.charCodeAt(k))>>>0;h2=(h2*31+s.charCodeAt(k))>>>0}return h.toString(36)+h2.toString(36)}
function sharedGet(i,src){
  if(!src.length||dead.sh)return Promise.resolve(null);
  return tmo(fetch("api/tr?id="+encodeURIComponent(id)+"&h="+hsh(src)),4000).then(function(r){if(!r.ok)return null;return r.json()}).then(function(a){return Array.isArray(a)&&a.length===src.length&&a.every(function(x){return typeof x==="string"})?a:null}).catch(function(){dead.sh=1;return null});
}
function sharedPut(src,res){
  if(dead.sh||!res||res.length!==src.length)return;
  for(var k=0;k<res.length;k++)if(typeof res[k]!=="string"||!res[k].trim())return;
  try{fetch("api/tr",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:id,h:hsh(src),t:res}),keepalive:false}).catch(function(){})}catch(e){}
}
function getTr2(i,src,onP,tok){
  var res=new Array(src.length),next=0,done=0,fatal=false;
  var conc=(!dead.gtx||!dead.nat)&&!dead.mm?3:1;
  return new Promise(function(ok,no){
    function worker(){
      if(fatal||(tok!=null&&tok!==trTok))return;
      var k=next++;if(k>=src.length)return;
      trText(src[k]).then(function(v){res[k]=v;done++;if(onP&&(tok==null||tok===trTok))onP(k,v);if(done===src.length){trCachePut(i,res);ok(res)}else worker()}).catch(function(e){fatal=true;no(e)});
    }
    if(!src.length)return ok([]);
    for(var w=0;w<conc;w++)worker();
  });
}
function paint(k,v){var e=$("txt").querySelector('[data-k="'+k+'"]');if(!e)return;e.innerHTML=esc(v)+(trm==="2"?'<span class="orig">'+esc(ptexts(cur)[k])+"</span>":"")}
function runTr(i){
  var tok=trTok,st=$("trs");st.hidden=false;st.textContent=L.tr1;
  var n=pages[i].b-pages[i].a,c=0;
  trp[i]=getTr(i,function(k,v){if(tok!==trTok)return;paint(k,v);c++;if(c<n)st.textContent=L.tr1+" "+c+"/"+n},tok);
  trp[i].then(function(){if(tok!==trTok)return;st.textContent=L.trd;if(i+1<pages.length&&trm!=="0"&&!trCacheGet(i+1)){var nt=trTok;setTimeout(function(){if(nt===trTok)getTr(i+1,null,nt).catch(function(){})},1500)}})
   .catch(function(){if(tok===trTok)st.innerHTML=L.trf+' <a href="https://translate.google.com/?sl=en&tl=vi&op=translate" target="_blank" rel="noopener">Google Translate</a>'});
}

/* ---------- listen (device voice or Piper) ---------- */
var playing=false,paused=false,queue=[],qi=0,VOICES=[],keep=null,sleepT=null;
function chunks(t){var out=[];t.replace(/\s+/g," ").split(/(?<=[.!?;:])\s+/).forEach(function(x){while(x.length>220){var k=x.lastIndexOf(" ",220);if(k<80)k=220;out.push(x.slice(0,k));x=x.slice(k)}if(x.trim())out.push(x)});return out}
var VI=/[àáảãạăằắẳẵặâầấẩẫậèéẻẽẹêềếểễệìíỉĩịòóỏõọôồốổỗộơờớởỡợùúủũụưừứửữựỳýỷỹỵđ]/i;
function lgOf(t){return VI.test(t)?"vi":"en"}
function score(v){var n=v.name,s=0;if(/natural|neural/i.test(n))s+=50;if(/online/i.test(n))s+=30;if(/google/i.test(n))s+=20;if(/siri|premium|enhanced/i.test(n))s+=25;if(/compact|espeak/i.test(n))s-=20;if(!v.localService)s+=5;return s}
function loadVoices(){
  var all=window.speechSynthesis?speechSynthesis.getVoices():[];
  VOICES=all.filter(function(v){return/^(en|vi)/i.test(v.lang)}).sort(function(a,b){return score(b)-score(a)});
  var sel=$("vo"),kv=ls("rv.voice")||"";sel.innerHTML='<option value="">Auto</option><option value="piper">'+L.piper+"</option>";
  VOICES.forEach(function(v){var o=document.createElement("option");o.value=v.name;o.textContent=v.name.replace(/^Microsoft |^Google /,"")+" ("+v.lang+")";sel.appendChild(o)});
  sel.value=kv;if(sel.value!==kv)sel.value="";
}
function pick(lg){
  var pref=ls("rv.voice"),p=VOICES.filter(function(v){return v.lang.toLowerCase().indexOf(lg)===0});
  if(pref){var m=VOICES.filter(function(v){return v.name===pref&&v.lang.toLowerCase().indexOf(lg)===0})[0];if(m)return m}
  if(lg==="en"){var us=p.filter(function(v){return/^en[-_](us|gb)/i.test(v.lang)});if(us.length)return us[0]}
  return p[0]||null;
}
var PV={en:"en_US-lessac-medium",vi:"vi_VN-vais1000-medium"},pmod=null,pc={},paudio=new Audio(),pfail=0;
function pLoad(){return pmod||(pmod=import("https://cdn.jsdelivr.net/npm/@mintplex-labs/piper-tts-web@1.0.4/+esm"))}
function pSynth(t){var lg=lgOf(t),k=lg+t;if(!pc[k]){var ks=Object.keys(pc);if(ks.length>6)delete pc[ks[0]];pc[k]=pLoad().then(function(m){return m.predict({text:t,voiceId:PV[lg]})})}return pc[k]}
function mark(k){[].forEach.call($("txt").querySelectorAll(".rd"),function(e){e.classList.remove("rd")});var el=$("txt").querySelector('[data-k="'+k+'"]');if(el){el.classList.add("rd");var r=el.getBoundingClientRect();if(r.top<80||r.bottom>innerHeight-160)el.scrollIntoView({block:"center",behavior:"smooth"})}}
async function buildQueue(startK){
  var texts=ptexts(cur);
  if(trm!=="0"){try{var t=await trp[cur];if(t&&t.length===texts.length)texts=t}catch(e){}}
  queue=[];texts.forEach(function(tx,k){if(k<startK)return;chunks(tx).forEach(function(c){queue.push({t:c,k:k})})});qi=0;
}
function firstVisibleK(){var els=$("txt").children;for(var i=0;i<els.length;i++){if(els[i].getBoundingClientRect().bottom>90)return+els[i].dataset.k}return 0}
function speak(){
  if(!playing||paused)return;
  if(qi>=queue.length){if(cur<pages.length-1){render(cur+1);buildQueue(0).then(function(){if(playing)speak()})}else stopA();return}
  var it=queue[qi++];mark(it.k);
  if(ls("rv.voice")==="piper"){
    $("pt").textContent="…";
    var nx=queue[qi];if(nx)pSynth(nx.t).catch(function(){});
    pSynth(it.t).then(function(b){if(!playing||paused)return;$("pt").textContent="⏸";var u=URL.createObjectURL(b);paudio.src=u;paudio.playbackRate=+$("sp").value;paudio.onended=function(){URL.revokeObjectURL(u);speak()};paudio.onerror=function(){URL.revokeObjectURL(u);speak()};return paudio.play()})
     .catch(function(){if(!playing)return;if(++pfail>=2){ls("rv.voice","");$("vo").value="";alert(L.pfail);qi=Math.max(0,qi-1);speak()}else{pc={};qi=Math.max(0,qi-1);setTimeout(speak,800)}});
    return;
  }
  var lg=lgOf(it.t),v=pick(lg),u=new SpeechSynthesisUtterance(it.t);
  u.rate=+$("sp").value;u.lang=v?v.lang:(lg==="vi"?"vi-VN":"en-US");if(v)u.voice=v;
  u.onend=function(){setTimeout(speak,/[.!?]$/.test(it.t)?120:40)};
  u.onerror=function(e){if(e.error!=="interrupted"&&e.error!=="canceled")stopA()};speechSynthesis.speak(u);
}
function cancelSpeech(){try{speechSynthesis.cancel()}catch(e){}try{paudio.pause()}catch(e){}}
function startA(){
  if(!window.speechSynthesis&&ls("rv.voice")!=="piper"){alert(L.nov);return}
  pfail=0;playing=true;paused=false;$("pl").classList.add("on");$("au").classList.add("on");$("pt").textContent="⏸";sizeFoot();
  cancelSpeech();loadVoices();
  buildQueue(firstVisibleK()).then(function(){speak()});
  clearInterval(keep);keep=setInterval(function(){if(playing&&!paused&&window.speechSynthesis&&speechSynthesis.speaking&&!speechSynthesis.paused&&ls("rv.voice")!=="piper"){speechSynthesis.pause();speechSynthesis.resume()}},12000);
}
function stopA(soft){
  playing=false;paused=false;clearInterval(keep);cancelSpeech();$("pt").textContent="▶";
  [].forEach.call($("txt").querySelectorAll(".rd"),function(e){e.classList.remove("rd")});
  if(!soft){$("pl").classList.remove("on");$("au").classList.remove("on");clearTimeout(sleepT)}

function pauseToggle(){
  if(!playing){startA();return}
  if(paused){paused=false;$("pt").textContent="⏸";qi=Math.max(0,qi-1);speak()}else{paused=true;cancelSpeech();$("pt").textContent="▶"}

function jump(d){
  if(!playing)return;var k=queue[Math.max(0,qi-1)]?queue[Math.max(0,qi-1)].k:0,t=Math.max(0,k+d);cancelSpeech();
  if(t>=pages[cur].b-pages[cur].a){if(cur<pages.length-1){render(cur+1);t=0}else t=k}
  buildQueue(t).then(function(){paused=false;speak()});
}

$("pt").onclick=pauseToggle;$("px").onclick=function(){stopA()};

$("vo").onchange=function(){ls("rv.voice",$("vo").value);if(playing&&!paused){cancelSpeech();qi=Math.max(0,qi-1);speak()}};
$("stm").onchange=function(){clearTimeout(sleepT);var m=+$("stm").value;if(m)sleepT=setTimeout(function(){stopA();$("stm").value="0"},m*60000)};

function loadZip(){return new Promise(function(ok,no){if(window.JSZip)return ok();var s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js";s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
function doEpub(btn){

      z.file("OEBPS/"+f,x(body));man+='<item id="c'+n+'" href="'+f+'" media-type="application/xhtml+xml"/>';spine+='<itemref idref="c'+n+'"/>';tc+='<li><a href="'+f+'">'+esc(s.t)+"</a></li>"});
    z.file("OEBPS/nav.xhtml",x('<nav epub:type="toc"><h1>Contents</h1><ol>'+tc+"</ol></nav>"));

    return z.generateAsync({type:"blob",mimeType:"application/epub+zip"});
  }).then(function(bl){var a=document.createElement("a");a.href=URL.createObjectURL(bl);a.download=name+".epub";document.body.appendChild(a);a.click();a.remove();btn.textContent=old}).catch(function(){btn.textContent=old;alert("EPUB error")});
