name: Build Desiring God catalog
on:
  workflow_dispatch:
  push:
    paths: ["tools/dg.mjs"]
  schedule:
    - cron: "0 4 7 * *"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/dg.mjs
      - run: |
          git config user.name "catalog-bot"
          git config user.email "bot@users.noreply.github.com"
          git add dg.json
          git diff --cached --quiet || (git commit -m "Update Desiring God catalog" && git pull --rebase && git push)
