name: Fetch hero image
on: workflow_dispatch
permissions: { contents: write }
jobs:
  f:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p img
          curl -fsSL -A "ReformedVietnam/1.0 (tranvuduc.vsec@gmail.com)" -o img/dore-sermon.jpg "https://upload.wikimedia.org/wikipedia/commons/thumb/b/b5/Dore_Bible_Sermon_on_the_Mount.jpg/800px-Dore_Bible_Sermon_on_the_Mount.jpg"
          ls -l img/dore-sermon.jpg; file img/dore-sermon.jpg
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add img; git commit -m "Self-host Dore hero image (public domain)" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push && exit 0; sleep 5; done
