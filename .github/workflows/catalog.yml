name: Build catalog
on:
  workflow_dispatch:
  push:
    paths: ["scripts/**"]
  schedule:
    - cron: "0 3 * * 1"
permissions:
  contents: write
jobs:
  build:
    timeout-minutes: 150
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/build-catalog.mjs
      - run: python3 tools/build-pages.py
      - run: |
          git config user.name "catalog-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A ia.json a b tac-gia.html tieng-viet.html sach-noi.html sitemap.xml hom-nay.html lo-trinh.html feed.xml chu-de
          git diff --cached --quiet && exit 0
          git commit -m "Update Internet Archive catalog"
          for i in 1 2 3 4; do git pull --rebase -X theirs && git push && exit 0; sleep 5; done
          exit 1
