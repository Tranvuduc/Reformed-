name: Build catalog
on:
  workflow_dispatch:
  push:
    paths: ["scripts/**"]
  schedule:
    - cron: "0 3 * * 1"
permissions:
  contents: write
jobs:
  build:
    timeout-minutes: 150
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/build-catalog.mjs
      - run: |
          git config user.name "catalog-bot"
          git config user.email "bot@users.noreply.github.com"
          cp ia.json /tmp/ia.new.json
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            cp /tmp/ia.new.json ia.json
            python3 tools/build-pages.py
            git add -A ia.json a b tac-gia.html tieng-viet.html sach-noi.html sitemap.xml hom-nay.html lo-trinh.html feed.xml chu-de khoa-hoc.html trich-dan.html thuat-ngu.html doi-song-viet-nam.html
            git diff --cached --quiet && exit 0
            git commit -q -m "Update Internet Archive catalog"
            git push -q origin HEAD:main && exit 0
            sleep $((RANDOM%10+3))
          done
          exit 1
