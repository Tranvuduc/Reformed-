name: AI pastor panel review
on: workflow_dispatch
permissions: { contents: write }
jobs:
  r:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { p: gemini, m: gemini-flash-latest }
          - { p: mistral, m: mistral-large-latest }
          - { p: cerebras, m: gpt-oss-120b }
          - { p: groq, m: openai/gpt-oss-120b }
          - { p: nvidia, m: meta/llama-3.3-70b-instruct }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/review.mjs
        env:
          PROVIDER: ${{ matrix.p }}
          MODEL: ${{ matrix.m }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      - run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add review
          git commit -m "Pastor panel review: ${{ matrix.p }}" || exit 0
          for i in 1 2 3 4 5 6; do git pull --rebase -X theirs origin main && git push && exit 0; sleep $((RANDOM%10+3)); done
