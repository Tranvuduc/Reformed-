name: Thử giọng Piper
on:
  workflow_dispatch:
    inputs:
      slug: {description: "Tên sách", default: "do-you-pray"}
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install piper-tts && sudo apt-get install -y ffmpeg >/dev/null
      - name: Tải giọng và tạo 3 đoạn mẫu mỗi giọng
        run: |
          for V in vi_VN-vais1000-medium vi_VN-25hours_single-low vi_VN-vivos-x_low; do
            python3 -m piper.download_voices $V || echo "::error::không tải được $V"
            python3 tools/tts_piper.py "${{ inputs.slug }}" --voice $V --limit 3 --out tts/test/$V || echo "::error::lỗi giọng $V"
          done
          ls -R tts/test
      - run: |
          git config user.name tts-bot; git config user.email bot@users.noreply.github.com
          git add tts/test; git commit -m "Mẫu giọng Piper" && git push || true
