name: Pre-translate books (Gemini)
on:
  workflow_dispatch:
    inputs:
      ids: { description: "Comma-separated CCEL ids, or 'tier1' / 'tier2'", default: "tier2" }
      pages: { description: "Max pages per book", default: "400" }
      model: { description: "Gemini model", default: "gemini-2.5-flash" }
permissions:
  contents: read
jobs:
  tr:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save playwright && npx playwright install --with-deps chromium
      - run: |
          IDS="${{ inputs.ids }}"
          case "$IDS" in
            tier1|tier2) IDS=$(node -e "console.log(require('./tools/priority.json')['$IDS'].join(','))") ;;
          esac
          test -n "$GEMINI_API_KEY" || { echo "Missing GEMINI_API_KEY secret"; exit 1; }
          BOT_NAME=gemini node tools/pretranslate.mjs "$IDS" "${{ inputs.pages }}"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ inputs.model }}
