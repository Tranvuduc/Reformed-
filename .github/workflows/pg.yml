name: Build Gutenberg catalog
on:
  workflow_dispatch:
  push:
    paths: ["tools/pg.mjs"]
  schedule:
    - cron: "0 4 10 * *"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/pg.mjs
      - run: |
          git config user.name "catalog-bot"
          git config user.email "bot@users.noreply.github.com"
          git add pg.json
          git diff --cached --quiet && exit 0
          git commit -m "Update Gutenberg catalog"
          for i in 1 2 3 4; do git pull --rebase -X theirs && git push && exit 0; sleep 5; done
          exit 1
